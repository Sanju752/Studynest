<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StudyNest — Student Hub</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#0f172a;color:#f8fafc;padding:20px;text-align:center;}
.card{background:#1e293b;padding:25px;border-radius:15px;max-width:500px;margin:20px auto;box-shadow:0 4px 10px rgba(0,0,0,0.3);}
button{background:#6366f1;color:white;border:none;padding:12px 20px;border-radius:8px;font-size:16px;cursor:pointer;margin-top:10px;}
button:hover{background:#4f46e5;}
input{padding:12px;width:80%;border-radius:8px;border:1px solid #475569;background:#0f172a;color:white;margin-top:10px;}
.page{display:none;}
.page.active{display:block;}
</style>
</head>
<body>

  <!-- Home Page -->
  <div id="home" class="page active">
    <h1>Welcome to StudyNest 📚</h1>
    <p>পড়ার ফাঁকে মিনি গেম খেলতে নিচের বাটনে ক্লিক করো:</p>
    <button onclick="showPage('game')">🎮 Mini Game খেলো</button>
  </div>

  <!-- Game Page -->
  <div id="game" class="page">
    <div class="card">
      <h2>Word Scramble Game</h2>
      <p>শব্দটি সাজাও: <b>T U S D E N T</b></p>
      <input type="text" id="userAns" placeholder="সঠিক উত্তর লিখো...">
      <br>
      <button onclick="checkAnswer()">Submit</button>
      <p id="resultMsg" style="margin-top:15px; font-weight:bold;"></p>
      <br>
      <button style="background:#334155;" onclick="showPage('home')">← Home এ ফিরে যাও</button>
    </div>
  </div>

<script>
function showPage(pageId) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(pageId).classList.add('active');
}

function checkAnswer() {
  const val = document.getElementById('userAns').value.trim().toUpperCase();
  const msg = document.getElementById('resultMsg');
  if(val === "STUDENT") {
    msg.style.color = "#4ade80";
    msg.textContent = "🎉 অভিনন্দন! তোমার উত্তর সঠিক হয়েছে!";
  } else {
    msg.style.color = "#f87171";
    msg.textContent = "❌ ভুল হয়েছে! সঠিক উত্তরটি হবে: STUDENT";
  }
}
</script>

</body>
</html>
