<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyNest — HSC Science</title>

<style>
:root{
  --bg:#f5f7fb;
  --card:#fff;
  --text:#172033;
  --muted:#6b7280;
  --primary:#2563eb;
  --primary2:#7c3aed;
  --border:#e5e7eb;
  --soft:#eef4ff;
  --danger:#ef4444;
  --success:#16a34a;
  --shadow:0 8px 25px rgba(20,30,60,.08);
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;
  background:var(--bg);
  color:var(--text);
  padding-bottom:78px;
}
body.dark{
  --bg:#0f172a;
  --card:#172033;
  --text:#f3f4f6;
  --muted:#aab3c2;
  --border:#263247;
  --soft:#1d2b46;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.header{
  position:sticky;
  top:0;
  z-index:20;
  background:var(--card);
  border-bottom:1px solid var(--border);
  padding:12px 15px;
}
.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.logo{
  font-size:21px;
  font-weight:800;
  color:var(--primary);
}
.logo span{color:var(--primary2)}
.header-actions{display:flex;gap:7px}
.icon-btn{
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  width:40px;height:40px;
  border-radius:12px;
}
.search{
  margin-top:10px;
  display:flex;
  gap:8px;
}
.search input{
  width:100%;
  border:1px solid var(--border);
  background:var(--bg);
  color:var(--text);
  padding:12px 14px;
  border-radius:13px;
  outline:none;
}
.container{
  max-width:900px;
  margin:auto;
  padding:16px;
}
.hero{
  background:linear-gradient(135deg,#2563eb,#7c3aed);
  color:white;
  border-radius:24px;
  padding:25px 20px;
  box-shadow:var(--shadow);
}
.hero h1{margin:0 0 7px;font-size:29px}
.hero p{margin:5px 0;opacity:.92}
.author{
  margin-top:17px;
  font-size:13px;
  opacity:.9;
}
.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:23px 2px 12px;
}
.section-title h2{font-size:20px;margin:0}
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:17px;
  padding:16px;
  box-shadow:var(--shadow);
}
.click{cursor:pointer;transition:.18s}
.click:active{transform:scale(.98)}
.subject-icon{
  font-size:30px;
  margin-bottom:8px;
}
.card h3{margin:5px 0;font-size:16px}
.card p{margin:4px 0;color:var(--muted);font-size:13px}
.btn{
  border:0;
  border-radius:12px;
  padding:11px 15px;
  background:var(--primary);
  color:white;
  font-weight:700;
}
.btn.secondary{
  background:var(--soft);
  color:var(--primary);
}
.btn.danger{background:var(--danger)}
.btn.success{background:var(--success)}
.btn.full{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap}
.back{
  margin-bottom:13px;
  display:inline-flex;
  align-items:center;
  gap:6px;
  background:var(--card);
  color:var(--text);
  border:1px solid var(--border);
  border-radius:11px;
  padding:9px 13px;
}
.paper{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.chapter-list{
  display:flex;
  flex-direction:column;
  gap:9px;
}
.chapter{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}
.chapter small{color:var(--muted)}
.badge{
  display:inline-block;
  padding:4px 8px;
  background:var(--soft);
  color:var(--primary);
  border-radius:20px;
  font-size:11px;
  font-weight:700;
}
.tool-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}
.tool{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:15px;
}
.tool .big{font-size:27px}
input,textarea,select{
  width:100%;
  padding:12px;
  border:1px solid var(--border);
  border-radius:12px;
  background:var(--bg);
  color:var(--text);
  outline:none;
}
textarea{min-height:130px;resize:vertical}
.form-group{margin-bottom:12px}
.form-group label{
  display:block;
  margin-bottom:6px;
  font-size:13px;
  font-weight:700;
}
.notice{
  background:var(--soft);
  border-radius:14px;
  padding:13px;
  margin:12px 0;
  font-size:13px;
}
.empty{
  text-align:center;
  padding:30px 15px;
  color:var(--muted);
}
.note{
  position:relative;
}
.note h3{padding-right:25px}
.note-meta{font-size:12px;color:var(--muted)}
.delete{
  position:absolute;
  top:10px;
  right:10px;
  border:0;
  background:transparent;
  color:var(--danger);
  font-size:18px;
}
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:50;
  padding:18px;
}
.modal.show{display:flex}
.modal-box{
  width:100%;
  max-width:560px;
  max-height:85vh;
  overflow:auto;
  background:var(--card);
  border-radius:20px;
  padding:20px;
}
.modal-head{
  display:flex;
  justify-content:space-between;
  gap:10px;
}
.close{
  border:0;
  background:var(--bg);
  color:var(--text);
  border-radius:10px;
  width:35px;height:35px;
}
.quiz-option{
  display:block;
  width:100%;
  text-align:left;
  margin:8px 0;
  padding:12px;
  border:1px solid var(--border);
  background:var(--bg);
  color:var(--text);
  border-radius:12px;
}
.timer{
  text-align:center;
  font-size:45px;
  font-weight:800;
  padding:20px;
}
.calc-display{
  font-size:26px;
  text-align:right;
  padding:15px;
  margin-bottom:9px;
}
.calc-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
}
.calc-grid button{
  padding:15px 5px;
  border:1px solid var(--border);
  border-radius:10px;
  background:var(--bg);
  color:var(--text);
}
.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:68px;
  z-index:30;
  background:var(--card);
  border-top:1px solid var(--border);
  display:flex;
  justify-content:space-around;
}
.nav{
  flex:1;
  border:0;
  background:transparent;
  color:var(--muted);
  font-size:11px;
}
.nav b{display:block;font-size:20px;margin-bottom:2px}
.nav.active{color:var(--primary);font-weight:700}
.story{
  background:linear-gradient(135deg,var(--soft),var(--card));
  border:1px solid var(--border);
  border-radius:18px;
  padding:17px;
  margin-bottom:12px;
}
.story h3{margin-top:0}
.story p{line-height:1.7}
.riddle{
  border-left:4px solid var(--primary);
  padding-left:13px;
}
.progressbar{
  height:10px;
  background:var(--border);
  border-radius:10px;
  overflow:hidden;
}
.progressbar span{
  display:block;
  height:100%;
  background:var(--primary);
  width:0;
}
.todo-item{
  display:flex;
  align-items:center;
  gap:10px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  padding:11px;
  margin-top:8px;
}
.todo-item.done{text-decoration:line-through;opacity:.55}
@media(min-width:700px){
  .grid{grid-template-columns:repeat(4,1fr)}
  .tool-grid{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>

</nav>

<div id="modal" class="modal">

</div>

/* =========================
   HELPERS
========================= */

function save(){
  localStorage.setItem("sn_completed",JSON.stringify(completed));
  localStorage.setItem("sn_bookmarks",JSON.stringify(bookmarks));
  localStorage.setItem("sn_notes",JSON.stringify(notes));
  localStorage.setItem("sn_todos",JSON.stringify(todos));
}

function esc(str){
  return String(str??"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function getAllChapters(){
  let arr=[];
  Object.entries(subjects).forEach(([id,s])=>{
    Object.entries(s.papers).forEach(([paper,chs])=>{
      chs.forEach(ch=>arr.push({
        subject:id,
        subjectName:s.name,
        paper,
        chapter:ch
      }));
    });
  });
  return arr;
}

function isComplete(key){
  return completed.includes(key);
}

function chapterKey(){
  return selectedSubject+"|"+selectedPaper+"|"+selectedChapter;
}

function toggleComplete(){
  const key=chapterKey();
  if(isComplete(key)){
    completed=completed.filter(x=>x!==key);
  }else{
    completed.push(key);
  }
  save();
  render();
}

function toggleBookmark(){
  const key=chapterKey();
  if(bookmarks.includes(key)){
    bookmarks=bookmarks.filter(x=>x!==key);
  }else{
    bookmarks.push(key);
  }
  save();
  render();
}

function go(route){
  page=route;
  render();
  window.scrollTo({top:0,behavior:"smooth"});
}

function calcPress(v){
  const input=document.getElementById("calc");
  if(!input)return;

  if(v==="C"){input.value="";return}
  if(v==="⌫"){input.value=input.value.slice(0,-1);return}
  if(v==="="){
    try{
      let exp=input.value.replaceAll("×","*").replaceAll("÷","/");
      if(!/^[0-9+\-*/().\s]+$/.test(exp))throw Error();
      input.value=String(Function('"use strict";return ('+exp+')')());
    }catch{
      input.value="Error";
    }
    return;
  }
  input.value+=v;
}

      </div>

      <div class="form-group">
        <label>Conversion</label>
        <select id="convType">
          <option value="km-m">Kilometer → Meter</option>
          <option value="m-km">Meter → Kilometer</option>
          <option value="m-cm">Meter → Centimeter</option>
          <option value="cm-m">Centimeter → Meter</option>
          <option value="kg-g">Kilogram → Gram</option>
          <option value="g-kg">Gram → Kilogram</option>
          <option value="c-f">Celsius → Fahrenheit</option>
          <option value="f-c">Fahrenheit → Celsius</option>
        </select>
      </div>

      <button class="btn full" data-action="convert">Convert</button>
      <div id="convResult" class="notice" style="display:none"></div>
    </div>
  `;
}

function convert(){
  const v=parseFloat(document.getElementById("convValue").value);
  const type=document.getElementById("convType").value;
  const out=document.getElementById("convResult");

  if(isNaN(v)){
    out.style.display="block";
    out.textContent="একটি value দাও।";
    return;
  }

  let r=0;
  const names={
    "km-m":"m",
    "m-km":"km",
    "m-cm":"cm",
    "cm-m":"m",
    "kg-g":"g",
    "g-kg":"kg",
    "c-f":"°F",
    "f-c":"°C"
  };

  if(type==="km-m")r=v*1000;
  if(type==="m-km")r=v/1000;
  if(type==="m-cm")r=v*100;
  if(type==="cm-m")r=v/100;
  if(type==="kg-g")r=v*1000;
  if(type==="g-kg")r=v/1000;
  if(type==="c-f")r=(v*9/5)+32;
  if(type==="f-c")r=(v-32)*5/9;

  out.style.display="block";
  out.innerHTML=`<b>Result:</b> ${r} ${names[type]}`;
}

  const percent=all.length?Math.round(done/all.length*100):0;

  return `
    <button class="back" data-route="tools">← Back</button>
    <div class="section-title"><h2>📊 Study Progress</h2></div>

    <div class="card">
      <h2>${percent}%</h2>
      <div class="progressbar"><span style="width:${percent}%"></span></div>
      <p>${done} / ${all.length} chapters completed</p>
    </div>

    <div class="section-title"><h2>Subject Progress</h2></div>

    ${Object.entries(subjects).map(([id,s])=>{
      const chapters=Object.values(s.papers).flat();
      const d=chapters.filter(ch=>completed.includes(
        id+"|"+Object.keys(s.papers).find(p=>s.papers[p].includes(ch))+"|"+ch
      )).length;
      const p=chapters.length?Math.round(d/chapters.length*100):0;

      return `
        <div class="card" style="margin-bottom:9px">
          <b>${s.icon} ${s.name}</b>
          <p>${d}/${chapters.length} completed</p>
          <div class="progressbar"><span style="width:${p}%"></span></div>
        </div>
      `;
    }).join("")}
  `;
}

/* =========================
   MODAL
========================= */

function showModal(html){
  document.getElementById("modalContent").innerHTML=html;
  document.getElementById("modal").classList.add("show");
}

function closeModal(){
  document.getElementById("modal").classList.remove("show");
}

function chapterModal(type){
  const title={
    notes:"📝 Chapter Notes",
    cq:"✍️ Creative Question",
    important:"⭐ Important Points"
  }[type];

  const text={
    notes:`<p><b>${esc(selectedChapter)}</b> chapter-এর জন্য এখানে নিজের short notes লিখে practice করতে পারো।</p>
           <ul><li>সংজ্ঞাগুলো আলাদা করে পড়ো</li><li>মূল সূত্রগুলো লিখে রাখো</li><li>Concept বুঝে তারপর MCQ practice করো</li></ul>`,
    cq:`<p><b>Practice CQ:</b> ${esc(selectedChapter)} বিষয়টি ব্যাখ্যা করো এবং প্রয়োজনীয় সূত্র/ধারণা প্রয়োগ করে সমস্যার সমাধান দেখাও।</p>`,
    important:`<ul><li>Chapter-এর গুরুত্বপূর্ণ সংজ্ঞা</li><li>মূল সূত্র ও একক</li><li>Common MCQ concepts</li><li>CQ-এর গুরুত্বপূর্ণ অংশ</li></ul>`
  }[type];

  showModal(`
    <div class="modal-head">
      <h2>${title}</h2>
      <button class="close" data-action="close-modal">×</button>
    </div>
    ${text}
  `);
}

/* =========================
   EVENTS
========================= */

document.addEventListener("click",e=>{
  const routeEl=e.target.closest("[data-route]");
  if(routeEl){
    const r=routeEl.dataset.route;
    go(r);
    return;
  }

  const actionEl=e.target.closest("[data-action]");
  if(!actionEl)return;

  const action=actionEl.dataset.action;

  if(action==="toggle-theme"){
    document.body.classList.toggle("dark");
    localStorage.setItem("sn_dark",
      document.body.classList.contains("dark")?"1":"0");
    render();
  }

  if(action==="open-subject"){
    selectedSubject=actionEl.dataset.subject;
    page="subject";
    render();
  }

  if(action==="open-paper"){
    selectedPaper=actionEl.dataset.paper;
    page="chapters";
    render();
  }

  if(action==="open-chapter"){
    selectedChapter=actionEl.dataset.chapter;
    page="chapter";
    render();
  }

  if(action==="back-subject"){
    page="subject";
    render();
  }

  if(action==="back-chapters"){
    page="chapters";
    render();
  }

  if(action==="complete")toggleComplete();
  if(action==="bookmark")toggleBookmark();

  if(action==="chapter-notes")chapterModal("notes");
  if(action==="chapter-cq")chapterModal("cq");
  if(action==="chapter-important")chapterModal("important");
  if(action==="chapter-mcq")chapterMCQ();

  if(action==="close-modal")closeModal();

  if(action==="mcq-correct"){
    alert("✅ Correct! Concept বুঝে পড়া সবচেয়ে ভালো।");
    closeModal();
  }

  if(action==="mcq-wrong"){
    alert("❌ Try again!");
  }

  if(action==="save-note"){
    const title=document.getElementById("noteTitle").value.trim();
    const subject=document.getElementById("noteSubject");
    const chapter=document.getElementById("noteChapter").value.trim();
    const content=document.getElementById("noteContent").value.trim();

    if(!title||!content){
      alert("Note title এবং content দাও।");
      return;
    }

    notes.unshift({
      title,
      subject:subject.options[subject.selectedIndex].text,
      chapter,
      content,
      date:new Date().toLocaleDateString()
    });

    save();
    alert("✅ Note saved!");
    page="notes";
    render();
  }

  if(action==="delete-note"){
    const i=Number(actionEl.dataset.note);
    if(confirm("এই note delete করবে?")){
      notes.splice(i,1);
      save();
      render();
    }
  }

  if(action==="timer-toggle"){
    if(timerRunning){
      clearInterval(timerInterval);
      timerRunning=false;
      render();
    }else{
      startTimer();
      render();
    }
  }

  if(action==="timer-reset"){
    clearInterval(timerInterval);
    timerRunning=false;
    timerSeconds=25*60;
    render();
  }

  if(action==="add-todo"){
    const input=document.getElementById("todoInput");
    const text=input.value.trim();
    if(!text)return;
    todos.push({text,done:false});
    save();
    render();
  }

  if(action==="todo-check"){
    const i=Number(actionEl.dataset.todo);
    todos[i].done=!todos[i].done;
    save();
    render();
  }

  if(action==="delete-todo"){
    const i=Number(actionEl.dataset.todo);
    todos.splice(i,1);
    save();
    render();
  }

  if(action==="convert")convert();

  if(action==="restart-quiz"){
    quizIndex=0;
    quizScore=0;
    render();
  }

  if(action==="quiz-answer"){
    const answer=Number(actionEl.dataset.answer);
    if(answer===quiz[quizIndex].ans)quizScore++;
    quizIndex++;
    render();
  }

  if(action==="official-result"){
    window.open("https://www.educationboardresults.gov.bd/","_blank");
  }

  if(action==="next-story"){
    currentStory=(currentStory+1)%stories.length;
    render();
  }

  if(action==="random-story"){
    currentStory=Math.floor(Math.random()*stories.length);
    render();
  }

  if(action==="show-riddle"){
    const i=Number(actionEl.dataset.riddle);
    showModal(`
      <div class="modal-head">
        <h2>🧩 Answer</h2>
        <button class="close" data-action="close-modal">×</button>
      </div>
      <p><b>${esc(riddles[i][0])}</b></p>
      <div class="notice">💡 ${esc(riddles[i][1])}</div>
    `);
  }

  if(action==="search-open"){
    selectedSubject=actionEl.dataset.subject;
    selectedPaper=actionEl.dataset.paper;
    selectedChapter=actionEl.dataset.chapter;
    page="chapter";
    render();
  }
});

document.addEventListener("click",e=>{
  const c=e.target.closest("[data-calc]");
  if(c)calcPress(c.dataset.calc);
});

document.getElementById("searchInput").addEventListener("input",()=>{
  const q=document.getElementById("searchInput").value.trim();
  if(q){
    page="search";
    render();
    const input=document.getElementById("searchInput");
    input.value=q;
    input.focus();
  }
});

/* =========================
   INITIAL
========================= */

if(localStorage.getItem("sn_dark")==="1"){
  document.body.classList.add("dark");
}

render();
</script>
