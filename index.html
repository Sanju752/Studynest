<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2563eb">
<title>StudyNest — Student Learning Hub</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  background:#f5f7fb;
  color:#172033;
  transition:.3s;
}

button,input,select,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  min-height:100vh;
  padding-bottom:80px;
}

/* HEADER */
.header{
  background:linear-gradient(135deg,#2563eb,#4f46e5);
  color:white;
  padding:18px 16px 25px;
  position:sticky;
  top:0;
  z-index:50;
  box-shadow:0 4px 15px #0002;
}

.header-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  max-width:1100px;
  margin:auto;
}

.logo{
  font-size:24px;
  font-weight:800;
}

.logo span{
  color:#bfdbfe;
}

.header-actions{
  display:flex;
  gap:8px;
}

.icon-btn{
  border:0;
  background:#ffffff22;
  color:white;
  width:40px;
  height:40px;
  border-radius:50%;
  font-size:18px;
}

/* MAIN */
main{
  max-width:1100px;
  margin:auto;
  padding:20px 15px;
}

.hero{
  background:linear-gradient(135deg,#dbeafe,#eef2ff);
  border-radius:25px;
  padding:28px 20px;
  margin-bottom:20px;
}

.hero h1{
  font-size:32px;
  margin-bottom:10px;
}

.hero p{
  color:#475569;
  line-height:1.6;
}

.author{
  display:inline-block;
  margin-top:15px;
  background:white;
  padding:9px 14px;
  border-radius:30px;
  color:#2563eb;
  font-weight:bold;
  box-shadow:0 3px 10px #0001;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(145px,1fr));
  gap:14px;
}

.card{
  background:white;
  border-radius:18px;
  padding:18px;
  box-shadow:0 5px 18px #0000000b;
  border:1px solid #e8edf5;
  transition:.2s;
}

.card:hover{
  transform:translateY(-3px);
  box-shadow:0 9px 25px #0002;
}

.click-card{
  cursor:pointer;
}

.card-icon{
  font-size:30px;
  margin-bottom:10px;
}

.card h3{
  margin-bottom:6px;
}

.card p{
  color:#64748b;
  font-size:14px;
  line-height:1.5;
}

/* SECTION */
.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:24px 0 13px;
}

.section-title h2{
  font-size:21px;
}

/* BUTTON */
.btn{
  border:0;
  background:#2563eb;
  color:white;
  padding:11px 16px;
  border-radius:12px;
  font-weight:bold;
}

.btn:hover{
  opacity:.9;
}

.btn.secondary{
  background:#e8eefc;
  color:#2563eb;
}

.btn.success{
  background:#16a34a;
}

.btn.danger{
  background:#dc2626;
}

.btn.dark{
  background:#172033;
}

/* BACK */
.back{
  display:inline-flex;
  align-items:center;
  gap:7px;
  margin-bottom:16px;
  border:0;
  background:#e8eefc;
  color:#2563eb;
  padding:10px 15px;
  border-radius:12px;
  font-weight:bold;
}

/* SUBJECT */
.subject-card{
  min-height:145px;
}

.subject-card .emoji{
  font-size:38px;
}

/* PAPER */
.paper{
  background:linear-gradient(135deg,#eff6ff,#eef2ff);
}

/* CHAPTER */
.chapter{
  display:flex;
  align-items:center;
  gap:12px;
}

.chapter-number{
  min-width:38px;
  height:38px;
  border-radius:50%;
  background:#2563eb;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  font-weight:bold;
}

/* DETAIL */
.detail-box{
  background:white;
  border-radius:20px;
  padding:20px;
  box-shadow:0 5px 20px #0001;
  margin-bottom:15px;
}

.detail-box h2{
  margin-bottom:10px;
}

.action-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  margin-top:15px;
}

/* SEARCH */
.search-box{
  display:flex;
  gap:8px;
  margin-bottom:18px;
}

.search-box input{
  flex:1;
  padding:13px;
  border:1px solid #d8dee9;
  border-radius:13px;
  outline:none;
  background:white;
}

/* FORMS */
.form{
  background:white;
  padding:20px;
  border-radius:20px;
  box-shadow:0 5px 20px #0001;
}

.form-group{
  margin-bottom:14px;
}

.form-group label{
  display:block;
  font-weight:bold;
  margin-bottom:6px;
}

.form-group input,
.form-group select,
.form-group textarea{
  width:100%;
  padding:12px;
  border:1px solid #d7deea;
  border-radius:11px;
  outline:none;
  background:white;
}

.form-group textarea{
  min-height:100px;
  resize:vertical;
}

/* TIMER */
.timer{
  text-align:center;
  font-size:45px;
  font-weight:800;
  padding:20px;
}

.timer-buttons{
  display:flex;
  gap:8px;
  justify-content:center;
  flex-wrap:wrap;
}

/* TODO */
.todo-row{
  display:flex;
  gap:8px;
  margin-bottom:15px;
}

.todo-row input{
  flex:1;
  padding:12px;
  border:1px solid #d7deea;
  border-radius:11px;
}

.todo-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#f8fafc;
  padding:12px;
  border-radius:10px;
  margin-bottom:8px;
}

.todo-item.done span{
  text-decoration:line-through;
  opacity:.5;
}

/* QUIZ */
.quiz-option{
  width:100%;
  text-align:left;
  padding:13px;
  border:1px solid #dbe2ef;
  background:white;
  border-radius:11px;
  margin-top:8px;
}

.quiz-option:hover{
  background:#eff6ff;
}

.quiz-score{
  font-size:30px;
  text-align:center;
  font-weight:bold;
  margin:20px;
}

/* PROGRESS */
.progress-bar{
  height:15px;
  background:#e2e8f0;
  border-radius:20px;
  overflow:hidden;
  margin:12px 0;
}

.progress-fill{
  height:100%;
  background:#2563eb;
  width:0%;
  transition:.3s;
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:#0008;
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
  z-index:100;
}

.modal.show{
  display:flex;
}

.modal-box{
  background:white;
  width:100%;
  max-width:600px;
  max-height:85vh;
  overflow:auto;
  border-radius:20px;
  padding:20px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.close{
  border:0;
  background:#fee2e2;
  color:#dc2626;
  width:35px;
  height:35px;
  border-radius:50%;
}

/* NAV */
.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:white;
  border-top:1px solid #e2e8f0;
  display:flex;
  justify-content:center;
  z-index:80;
  box-shadow:0 -3px 15px #0001;
}

.nav-inner{
  width:100%;
  max-width:700px;
  display:grid;
  grid-template-columns:repeat(5,1fr);
}

.nav-btn{
  border:0;
  background:none;
  padding:10px 4px;
  color:#64748b;
  font-size:12px;
}

.nav-btn b{
  display:block;
  font-size:20px;
  margin-bottom:2px;
}

.nav-btn.active{
  color:#2563eb;
}

/* EMPTY */
.empty{
  text-align:center;
  padding:30px 10px;
  color:#64748b;
}

/* DARK MODE */
body.dark{
  background:#0f172a;
  color:#e5e7eb;
}

body.dark .card,
body.dark .detail-box,
body.dark .form,
body.dark .modal-box{
  background:#172033;
  border-color:#263247;
}

body.dark .card p,
body.dark .hero p{
  color:#aab6c8;
}

body.dark .hero{
  background:linear-gradient(135deg,#172554,#1e1b4b);

body.dark .search-box input,
body.dark .form-group input,
body.dark .form-group select,
body.dark .form-group textarea,
body.dark .todo-row input,
body.dark .quiz-option{
  background:#0f172a;
  color:white;
  border-color:#334155;

body.dark .paper{
  background:#172554;
}

body.dark .bottom-nav{
  background:#172033;
  border-color:#263247;

body.dark .nav-btn{
  color:#94a3b8;

body.dark .todo-item{
  background:#0f172a;

body.dark .back{
  background:#1e3a8a;
  color:#bfdbfe;

/* DESKTOP */
@media(min-width:700px){
  .action-grid{
    grid-template-columns:repeat(4,1fr);
  }
}

/* SMALL */
@media(max-width:420px){
  .hero h1{
    font-size:27px;
  }

  .grid{
    grid-template-columns:repeat(2,1fr);
  }

  .card{
    padding:14px;
  }

  .action-grid{
    grid-template-columns:1fr 1fr;
  }
}
</style>
</head>

/* =====================================================
   APP STATE
===================================================== */

let state={
  page:"home",
  subject:null,
  paper:null,
  chapter:null,
  search:"",
  quizIndex:0,
  quizScore:0,
  quizFinished:false,
  timerSeconds:1500,
  timerRunning:false
};

let timerInterval=null;


/* =====================================================
   LOCAL DATA
===================================================== */

let completed=JSON.parse(localStorage.getItem("sn_completed")||"[]");
let bookmarks=JSON.parse(localStorage.getItem("sn_bookmarks")||"[]");
let todos=JSON.parse(localStorage.getItem("sn_todos")||"[]");


/* =====================================================
   HELPER
===================================================== */

function saveData(){
  localStorage.setItem("sn_completed",JSON.stringify(completed));
  localStorage.setItem("sn_bookmarks",JSON.stringify(bookmarks));
  localStorage.setItem("sn_todos",JSON.stringify(todos));
}

function esc(text){
  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");
}

function allChapters(){

  let arr=[];

  for(const subject in subjects){

    for(const paper in subjects[subject].papers){

      subjects[subject].papers[paper].forEach(chapter=>{

        arr.push({
          subject,
          paper,
          chapter
        });

      });

    }

  }

  return arr;
}

function chapterKey(){
  return `${state.subject}|${state.paper}|${state.chapter}`;
}

function updateNav(){

  document.querySelectorAll(".nav-btn").forEach(btn=>{
    btn.classList.toggle(
      "active",
      btn.dataset.route===state.page
    );
  });

}


/* =====================================================
   NAVIGATION
===================================================== */

function go(page,extra={}){

  state.page=page;

  Object.assign(state,extra);

  render();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}

function back(){

  if(state.page==="chapter"){
    go("chapters");
  }
  else if(state.page==="chapters"){
    go("papers");

function timerHTML(){

  return `

    <div class="detail-box">

      <h2>⏱️ Study Timer</h2>

      <div class="timer" id="timerDisplay">
        ${formatTime(state.timerSeconds)}
      </div>

      <div class="timer-buttons">

        <button class="btn" data-action="startTimer">
          ▶ Start
        </button>

        <button class="btn secondary" data-action="pauseTimer">
          ⏸ Pause
        </button>

        <button class="btn danger" data-action="resetTimer">
          ↻ Reset
        </button>

      </div>

    </div>

  `;

}

function formatTime(sec){

  let m=Math.floor(sec/60);
  let s=sec%60;

  return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;

}

function startTimer(){

  if(timerInterval) return;

  state.timerRunning=true;

  timerInterval=setInterval(()=>{

    if(state.timerSeconds>0){

      state.timerSeconds--;

      const el=document.getElementById("timerDisplay");

      if(el) el.textContent=formatTime(state.timerSeconds);

    }
    else{

      clearInterval(timerInterval);
      timerInterval=null;
      state.timerRunning=false;

      alert("🎉 Study session complete!");

    }

  },1000);

}

function pauseTimer(){

  clearInterval(timerInterval);
  timerInterval=null;
  state.timerRunning=false;

}

function resetTimer(){

  pauseTimer();

  state.timerSeconds=1500;

  const el=document.getElementById("timerDisplay");

  if(el) el.textContent=formatTime(1500);

}

/* =====================================================
   EVENT DELEGATION
   IMPORTANT — সব button এখান থেকে কাজ করবে
===================================================== */

document.addEventListener("click",function(e){

  const route=e.target.closest("[data-route]");

  if(route){

    go(route.dataset.route);

    return;

  }


  const action=e.target.closest("[data-action]");

  if(action){

    const a=action.dataset.action;


    if(a==="back"){
      back();
    }


    else if(a==="theme"){

      document.body.classList.toggle("dark");

      localStorage.setItem(
        "sn_dark",
        document.body.classList.contains("dark")
      );

    }


    else if(a==="search"){

      state.search="";

      go("search");

    }


    else if(a==="subject"){

      go("papers",{
        subject:action.dataset.subject
      });

    }


    else if(a==="paper"){

      go("chapters",{
        paper:action.dataset.paper
      });

    }


    else if(a==="chapter"){

      go("chapter",{
        chapter:action.dataset.chapter
      });

    }


    else if(a==="openSearch"){

      go("chapter",{
        subject:action.dataset.subject,
        paper:action.dataset.paper,
        chapter:action.dataset.chapter
      });

    }


    else if(a==="doSearch"){

      const input=document.getElementById("searchInput");

      state.search=input ? input.value.trim() : "";

      render();

    }


    else if(a==="noteSearch"){

      const input=document.getElementById("noteSearch");

      state.search=input ? input.value.trim() : "";

      render();

    }


    else if(a==="saveNote"){

      saveNewNote();

    }


    else if(a==="viewNote"){

      viewNote(action.dataset.id);

    }


    else if(a==="deleteNote"){

      deleteNote(action.dataset.id);

    }


    else if(a==="result"){

      openResult();

    }


    else if(a==="startTimer"){

      startTimer();

    }


    else if(a==="pauseTimer"){

      pauseTimer();

    }


    else if(a==="resetTimer"){

      resetTimer();

    }


    else if(a==="calculate"){

      calculate();

    }


    else if(a==="addTodo"){

      addTodo();

    }


    else if(a==="toggleTodo"){

      toggleTodo(Number(action.dataset.index));

    }


    else if(a==="removeTodo"){

      todos.splice(Number(action.dataset.index),1);

      saveData();

      document.getElementById("todoList").innerHTML=renderTodos();

    }


    else if(a==="convert"){

      convertUnit();

    }


    else if(a==="complete"){

      toggleComplete();

    }


    else if(a==="bookmark"){

      toggleBookmark();

    }


    else if(a==="chapterContent"){

      showChapterContent(action.dataset.type);

    }


    else if(a==="chapterNotes"){

      state.search=state.chapter;

      go("notes");

    }


    else if(a==="answer"){

      answerQuiz(Number(action.dataset.answer));

    }


    else if(a==="restartQuiz"){

      state.quizIndex=0;
      state.quizScore=0;
      state.quizFinished=false;

      render();

    }


    else if(a==="riddleAnswer"){

      openModal(
        "🧠 Answer",
        `<h3>তোয়ালে! 🧻</h3>
         <p style="margin-top:10px">
         তোয়ালে অন্য জিনিসকে শুকাতে গিয়ে নিজেই ভিজে যায়। 😄
         </p>`
      );

    }


    else if(a==="closeModal"){

      closeModal();

    }

  }

});

/* =====================================================
   NOTES
===================================================== */

function saveNewNote(){

  const title=document.getElementById("noteTitle").value.trim();

  const subject=document.getElementById("noteSubject").value;

  const chapter=document.getElementById("noteChapter").value.trim();

  const content=document.getElementById("noteContent").value.trim();


  if(!title || !subject || !chapter || !content){

    alert("সব তথ্য পূরণ করো 🙂");

    return;

  }


  const notes=getNotes();

  notes.unshift({

    id:Date.now().toString(),

    title,

    subject,

    chapter,

    content,

    date:new Date().toISOString()

  });


  saveNotes(notes);

  alert("✅ Note successfully saved!");

  state.search="";

  go("notes");

}


function viewNote(id){

  const note=getNotes().find(n=>n.id===id);

  if(!note) return;

  openModal(

    "📝 "+note.title,

    `

      <p>
        <b>Subject:</b> ${esc(note.subject)}
      </p>

      <p style="margin-top:5px">
        <b>Chapter:</b> ${esc(note.chapter)}
      </p>

      <hr style="margin:15px 0">

      <div style="white-space:pre-wrap;line-height:1.7">
        ${esc(note.content)}
      </div>

    `

  );

}


function deleteNote(id){

  if(!confirm("এই note delete করবে?")) return;

  let notes=getNotes();

  notes=notes.filter(n=>n.id!==id);

  saveNotes(notes);

  render();

}

/* =====================================================
   CALCULATOR
===================================================== */

function calculate(){

  const input=document.getElementById("calcInput");

  const result=document.getElementById("calcResult");

  if(!input || !result) return;

  const expression=input.value.trim();

  if(!expression){

    result.textContent="Enter calculation";

    return;

  }

  if(!/^[0-9+\-*/().%\s]+$/.test(expression)){

    result.textContent="Invalid expression";

    return;

  }

  try{

    const value=Function(
      `"use strict"; return (${expression})`
    )();

    result.textContent="= "+value;

  }
  catch{

    result.textContent="Invalid calculation";

  }

}

function addTodo(){

}


/* =====================================================
   CONVERTER
===================================================== */

function convertUnit(){

  const value=parseFloat(
    document.getElementById("convertValue").value
  );

  const type=document.getElementById("convertType").value;

  const result=document.getElementById("convertResult");

  if(isNaN(value)){

    result.textContent="Enter a number";

    return;

  }

  let output=0;

  switch(type){

    case "km-m":
      output=value*1000;
      break;

    case "m-km":
      output=value/1000;
      break;

    case "kg-g":
      output=value*1000;
      break;

    case "g-kg":
      output=value/1000;
      break;

    case "c-f":
      output=(value*9/5)+32;
      break;

    case "f-c":
      output=(value-32)*5/9;
      break;

  }

  result.textContent=output;

}

function answerQuiz(answer){

  const q=quizQuestions[state.quizIndex];

  if(answer===q.answer){

    state.quizScore++;

    alert("✅ Correct!");

  }
  else{

    alert(
      "❌ Wrong!\nCorrect answer: "+
      q.options[q.answer]
    );

  }

  state.quizIndex++;

  if(state.quizIndex>=quizQuestions.length){

    state.quizFinished=true;

  }

  render();

}
