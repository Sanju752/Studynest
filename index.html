<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>StudyNest 📚</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  background:linear-gradient(135deg,#eef7ff,#f7fbff);
  color:#17233c;
  min-height:100vh;
}

header{
  background:#ffffff;
  padding:18px 22px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:100;
  box-shadow:0 3px 15px rgba(0,0,0,.08);
}

.logo{
  font-size:26px;
  font-weight:800;
  color:#2563eb;
}

.logo span{
  color:#14b8a6;
}

.logoIcon{
  font-size:30px;
}

button{
  border:0;
  cursor:pointer;
  font-family:inherit;
}

.themeBtn{
  width:48px;
  height:48px;
  border-radius:50%;
  background:#eef6ff;
  font-size:23px;
}

.container{
  width:92%;
  max-width:1100px;
  margin:auto;
}

.hero{
  text-align:center;
  padding:55px 10px 35px;
}

.hero h1{
  font-size:42px;
  line-height:1.15;
  margin-bottom:18px;
}

.hero h1 span{
  color:#2563eb;
}

.hero p{
  font-size:18px;
  line-height:1.8;
  color:#66758b;
  max-width:750px;
  margin:auto;
}

.heroButtons{
  margin-top:28px;
  display:flex;
  justify-content:center;
  gap:15px;
  flex-wrap:wrap;
}

.primary{
  background:#2563eb;
  color:white;
  padding:16px 27px;
  border-radius:15px;
  font-size:17px;
  font-weight:bold;
  box-shadow:0 10px 25px rgba(37,99,235,.25);
}

.secondary{
  background:white;
  color:#2563eb;
  padding:16px 27px;
  border-radius:15px;
  font-size:17px;
  font-weight:bold;
  border:1px solid #dce7f5;
}

.section{
  margin:35px 0;
}

.sectionTitle{
  text-align:center;
  font-size:28px;
  margin-bottom:22px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:18px;
}

.card{
  background:rgba(255,255,255,.9);
  border:1px solid #dce7f5;
  border-radius:22px;
  padding:24px;
  box-shadow:0 8px 25px rgba(30,70,110,.08);
  transition:.25s;
}

.card:hover{
  transform:translateY(-4px);
}

.subjectCard{
  cursor:pointer;
  text-align:center;
}

.subjectIcon{
  font-size:45px;
  margin-bottom:12px;
}

.subjectCard h3{
  font-size:20px;
  margin-bottom:7px;
}

.subjectCard p{
  color:#718096;
}

.searchBox{
  width:100%;
  padding:16px 18px;
  border-radius:15px;
  border:1px solid #d5e2f1;
  outline:none;
  font-size:16px;
  margin-bottom:20px;
}

.paperBox{
  background:white;
  border-radius:22px;
  padding:22px;
  margin-bottom:20px;
  border:1px solid #dce7f5;
  box-shadow:0 7px 20px rgba(0,0,0,.06);
}

.paperTitle{
  font-size:22px;
  color:#2563eb;
  margin-bottom:16px;
}

.chapter{
  background:#f7fbff;
  border:1px solid #e0eaf5;
  border-radius:15px;
  padding:17px;
  margin:10px 0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  cursor:pointer;
  transition:.2s;
}

.chapter:hover{
  background:#edf5ff;
  transform:translateX(3px);
}

.chapterName{
  font-weight:bold;
}

.chapterNum{
  width:36px;
  height:36px;
  display:flex;
  justify-content:center;
  align-items:center;
  border-radius:50%;
  background:#2563eb;
  color:white;
  font-weight:bold;
  flex-shrink:0;
}

.backBtn{
  background:#17233c;
  color:white;
  padding:12px 18px;
  border-radius:12px;
  margin-bottom:20px;
}

.toolsGrid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:16px;
}

  border-radius:20px;
  padding:22px;
