<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>StudyNest | Student Notes</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial, sans-serif;
    background:#070914;
    color:#f5f7ff;
    overflow-x:hidden;
}

/* Background glow */
body::before{
    content:"";
    position:fixed;
    width:330px;
    height:330px;
    background:#7567ff;
    filter:blur(130px);
    opacity:.16;
    top:-120px;
    left:-120px;
    z-index:-1;
}

body::after{
    content:"";
    position:fixed;
    width:330px;
    height:330px;
    background:#00d9ff;
    filter:blur(140px);
    opacity:.12;
    bottom:-120px;
    right:-120px;
    z-index:-1;
}

/* NAVBAR */
nav{
    position:sticky;
    top:0;
    z-index:100;
    padding:16px 6%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:rgba(7,9,20,.82);
    backdrop-filter:blur(18px);
    border-bottom:1px solid rgba(255,255,255,.07);
}

.logo{
    font-size:22px;
    font-weight:800;
}

.logo span{
    color:#8c7cff;
}

.menu{
    display:flex;
    gap:18px;
}

.menu a{
    color:#aeb3c4;
    text-decoration:none;
    font-size:12px;
}

.menu a:hover{
    color:white;
}

/* HERO */
.hero{
    min-height:78vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:70px 20px;
}

.hero-content{
    max-width:750px;
}

.badge{
    display:inline-block;
    padding:8px 15px;
    border-radius:30px;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.1);
    color:#aaa2ff;
    font-size:12px;
    margin-bottom:22px;
}

.hero h1{
    font-size:clamp(43px,10vw,80px);
    line-height:1;
    letter-spacing:-3px;
    margin-bottom:22px;
}

.gradient{
    background:linear-gradient(90deg,#9b8cff,#43dcff);
    -webkit-background-clip:text;
    color:transparent;
}

.hero p{
    color:#9298aa;
    line-height:1.8;
    font-size:14px;
}

.buttons{
    margin-top:28px;
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
}

.btn{
    display:inline-block;
    padding:13px 21px;
    border-radius:30px;
    text-decoration:none;
    font-size:12px;
    font-weight:bold;
}

.primary{
    color:white;
    background:linear-gradient(90deg,#6d5dfc,#00bcd4);
}

.secondary{
    color:#c4c8d8;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.1);
}

/* GENERAL SECTION */
section{
    padding:65px 6%;
}

.title{
    text-align:center;
    margin-bottom:30px;
}

.title h2{
    font-size:30px;
}

.title p{
    color:#777d90;
    font-size:13px;
    margin-top:8px;
}

/* SUBJECTS */
.subject-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(145px,1fr));
    gap:15px;
}

.subject{
    padding:25px 18px;
    border-radius:20px;
    text-decoration:none;
    color:white;
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.08);
    transition:.3s;
}

.subject:hover{
    transform:translateY(-6px);
    border-color:#7568ff;
}

.subject-icon{
    font-size:30px;
    margin-bottom:14px;
}

.subject h3{
    font-size:15px;
}

.subject p{
    color:#747a8d;
    font-size:11px;
    margin-top:6px;
}

/* SEARCH */
.search{
    max-width:650px;
    margin:0 auto 30px;
}

.search input{
    width:100%;
    padding:16px 20px;
    border-radius:30px;
    border:1px solid rgba(255,255,255,.1);
    outline:none;
    background:rgba(255,255,255,.045);
    color:white;
}

.search input::placeholder{
    color:#6e7486;
}

/* SUBJECT SECTION */
.subject-section{
    margin-top:50px;
}

.subject-heading{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:20px;
}

.subject-heading .big-icon{
    font-size:30px;
}

.subject-heading h2{
    font-size:23px;
}

.subject-heading p{
    color:#73798c;
    font-size:11px;
    margin-top:4px;
}

/* NOTES */
.notes{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:15px;
}

.note{
    padding:20px;
    border-radius:18px;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.075);
    transition:.3s;
}

.note:hover{
    transform:translateY(-4px);
    background:rgba(255,255,255,.06);
}

.note-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}
